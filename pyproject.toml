[project]
name = "reviewpilot-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.36",
  "pydantic[email]==2.10.4",
  "pydantic-settings==2.7.0",
  "PyJWT==2.10.1",
  "bcrypt==4.2.1",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
  "psycopg2-binary==2.9.10",
]

[tool.vercel]
entrypoint = "api/index.py"
